# FinSight AI — full stack: PostgreSQL + Redis + Ollama (local LLM) + FastAPI + Next.js
#   cp .env.example .env      (optional: add API keys)
#   docker compose up --build
# Frontend http://localhost:3000 · API http://localhost:8000/docs

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finsight
      POSTGRES_PASSWORD: finsight
      POSTGRES_DB: finsight_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finsight -d finsight_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://finsight:finsight@postgres:5432/finsight_db
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      OLLAMA_BASE_URL: http://ollama:11434
      PORT: "8000"
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Local LLM. After the first start, pull the models once:
  #   docker compose exec ollama ollama pull qwen2.5:3b
  #   docker compose exec ollama ollama pull nomic-embed-text
  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_CONTEXT_LENGTH: "8192"
    volumes:
      - ollama_models:/root/.ollama

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  ollama_models:
  postgres_data:
  redis_data:
  backend_data:
