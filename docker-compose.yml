version: "3.9"

services:
  # ---- PostgreSQL ----
  postgres:
    image: pgvector/pgvector:pg16
    container_name: finsight_postgres
    environment:
      POSTGRES_USER: finsight
      POSTGRES_PASSWORD: password
      POSTGRES_DB: finsight_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finsight -d finsight_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Redis ----
  redis:
    image: redis:7-alpine
    container_name: finsight_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Backend (FastAPI) ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finsight_backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://finsight:password@postgres:5432/finsight_db
      SYNC_DATABASE_URL: postgresql://finsight:password@postgres:5432/finsight_db
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - model_data:/app/data/models
      - chromadb_data:/app/data/chromadb
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ---- Celery Worker ----
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finsight_celery
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://finsight:password@postgres:5432/finsight_db
      SYNC_DATABASE_URL: postgresql://finsight:password@postgres:5432/finsight_db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
      - model_data:/app/data/models
    depends_on:
      - redis
      - postgres
    command: celery -A app.tasks.celery_app worker --loglevel=info

  # ---- Frontend (Next.js) ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finsight_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_APP_NAME: FinSight AI
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
  model_data:
  chromadb_data:
